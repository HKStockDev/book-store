services:
  - type: web
    name: book-store-api
    runtime: node
    buildCommand: cd packages/api && pnpm install && pnpm run build
    startCommand: cd packages/api && pnpm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: PORT
        value: 3000
